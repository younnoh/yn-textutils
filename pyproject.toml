[project]
name = "yn-textutils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Youn Noh", email = "youn.noh@yale.edu" }
]
requires-python = ">=3.15"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
words = "yn_textutils:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.88",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
